input {
  file {
    # 监控的路径，对应你 logback-spring.xml 中的 LOG_PATH
    #path => "/your/app/logs/**/*.json.gz"
    path => "/your/app/logs/*.json.gz"
    # 设置为从头开始读取（如果是新文件）
    start_position => "beginning"

    # 记录上次读取的位置，防止重启后重复同步
    sincedb_path => "/usr/share/logstash/data/plugins/inputs/file/ice_sincedb"

    # 如果希望读取现有文件后就停止（而不是持续监控）
    # exit_after_read => true
    # file_completed_action => "delete"  # 读完后删除（谨慎使用）
    # file_completed_log_path => "/var/log/logstash/completed.log"

    # 【关键】因为是 .gz 格式，必须指定 mode 为 read，并使用 gzip_lines 解码器
    mode => "read"
    codec => gzip_lines
    # codec => "json"

    # 完成后动作：是删除还是保留（默认是 delete，生产建议改为 tail 模式监控）
    # 注意：如果文件是滚动生成的，read 模式通常配合 file_completed_action => "delete"
    # 如果想实时监控新增的普通 json，建议不加 .gz，直接用 tail 模式
    # 如果是持续监控新增的 .gz 文件，保持默认即可
    # 建议添加：
    discover_interval => 15  # 每15秒检查一次新文件
    ignore_older => 86400    # 忽略1天前的文件，避免重复处理
  }
}

filter {
  # 自动解析 JSON 字符串
  json {
    source => "message"
  }

  # 时间转换：将日志里的 timestamp 字符串转为 ES 识别的日期格式
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
    }
  }

  # 清理掉不需要的原始冗余字段
  mutate {
    rename => { "path" => "log_file" }
    remove_field => ["host",  "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    # 索引名按天自动生成，方便后期管理和清理
    index => "ice-admin-%{+YYYY.MM.dd}"
    # user => "elastic"
    # password => "your_password"
  }

  # 调试模式：在控制台打印解析结果
  # 生产环境建议注释掉 stdout，避免日志过多
  # stdout { codec => rubydebug }
}